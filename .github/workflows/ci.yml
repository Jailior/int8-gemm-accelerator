# Correctness CI: every check that needs neither a GPU nor the board.
# Questa needs a license, so CI runs the same testbenches in Icarus Verilog and
# lints the RTL with Verilator. run_all.sh decides pass or fail.
name: correctness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog verilator

      - name: Preflight
        run: bash preflight.sh

      - name: Run all checks
        run: bash run_all.sh

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: build/
